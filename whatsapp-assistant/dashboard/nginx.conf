server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options DENY always;
  add_header Referrer-Policy no-referrer always;
  add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self'; script-src 'self'; connect-src 'self'; frame-ancestors 'none'" always;

  # Seule l'API du dashboard est relayée : /webhooks n'est joignable que depuis le réseau Docker interne
  location /api/ {
    resolver 127.0.0.11 valid=10s;
    set $backend http://backend:4000;
    proxy_pass $backend;
    proxy_set_header Host $host;
    proxy_read_timeout 30s;
  }
  location / {
    try_files $uri /index.html;
    add_header Cache-Control "no-cache";
  }
}
